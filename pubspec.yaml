name: axn_app
description: "AXN — Ticket Activation. Digital Twin smart venue/tourism companion app for Hussain Stadium & Amra Smart City."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.6
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.0
  go_router: ^14.2.0
  dio: ^5.4.3+1
  shared_preferences: ^2.2.3
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/icon.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  # Fonts are loaded at runtime via google_fonts (El Messiri, IBM Plex Sans Arabic,
  # IBM Plex Mono, Cairo) — matching the <link> Google Fonts imports in the HTML
  # prototype's <head>. google_fonts automatically caches the .ttf files, so no
  # manual font asset declarations are required here.
