name: axn_app
description: "AXN — Ticket Activation. Digital Twin smart venue/tourism companion app for Hussain Stadium & Amra Smart City."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.2.6
  flutter_riverpod: ^2.5.1
  flutter_animate: ^4.5.0
  go_router: ^14.2.0
  dio: ^5.4.3+1
  shared_preferences: ^2.5.5
  http: ^1.6.0
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/bottom_nav_icons.png
    - assets/std.png

  # Fonts are loaded at runtime via google_fonts (El Messiri, IBM Plex Sans Arabic,
  # IBM Plex Mono, Cairo) — matching the <link> Google Fonts imports in the HTML
  # prototype's <head>. google_fonts automatically caches the .ttf files, so no
  # manual font asset declarations are required here.
